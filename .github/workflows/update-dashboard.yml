name: Update dashboard data

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate fresh data
        run: |
          python main.py
          python tokenized_stocks.py
          python build_dashboard.py
